name: CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}


jobs:

  # --------------------------------
  # CI
  # --------------------------------

  test:
    name: Run Backend Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: |
          pytest


  # --------------------------------
  # Build and Push Docker Images
  # --------------------------------

  build-and-push:
    name: Build and Push Docker Images

    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      # Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # Build frontend
      - name: Build frontend image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/github-cicd-demo-frontend:${{ github.sha }} \
            ./frontend


      # Build backend
      - name: Build backend image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/github-cicd-demo-backend:${{ github.sha }} \
            ./backend


      # Push frontend
      - name: Push frontend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/github-cicd-demo-frontend:${{ github.sha }}


      # Push backend
      - name: Push backend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/github-cicd-demo-backend:${{ github.sha }}