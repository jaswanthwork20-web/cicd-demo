
name: CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ==================================================
# GLOBAL ENVIRONMENT
# ==================================================

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "317492541707"

  ECR_REGISTRY: 317492541707.dkr.ecr.us-east-1.amazonaws.com

  ECR_FRONTEND_REPOSITORY: github-cicd-demo-frontend
  ECR_BACKEND_REPOSITORY: github-cicd-demo-backend


# ==================================================
# DEFAULT PERMISSIONS
# ==================================================

permissions:
  contents: read


jobs:

  # ==================================================
  # JOB 1 - SYNTAX CHECK
  # ==================================================

  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        working-directory: backend
        run: |
          python -m compileall -q .


  # ==================================================
  # JOB 2 - LINTING
  # ==================================================

  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        working-directory: backend
        run: |
          ruff check .


  # ==================================================
  # JOB 3 - UNUSED CODE
  # ==================================================

  unused-code:
    name: Unused Code Detection
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Vulture
        run: |
          python -m pip install --upgrade pip
          pip install vulture

      - name: Detect unused code
        working-directory: backend
        run: |
          vulture . --min-confidence 80


  # ==================================================
  # JOB 4 - TYPE CHECKING
  # ==================================================

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Run MyPy
        working-directory: backend
        run: |
          mypy .


  # ==================================================
  # JOB 5 - UNIT TESTS + COVERAGE
  # ==================================================

  test:
    name: Unit Tests and Coverage
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        working-directory: backend
        run: |
          pytest \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml


  # ==================================================
  # JOB 6 - SECURITY SCANNING
  # ==================================================

  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit security scan
        working-directory: backend
        continue-on-error: true
        run: |
          bandit -r . -ll


  # ==================================================
  # JOB 7 - SECRET DETECTION
  # ==================================================

  secrets:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==================================================
  # JOB 8 - DEPENDENCY SCANNING
  # ==================================================

  dependency-scan:
    name: Dependency Vulnerability Scan
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit
        working-directory: backend
        run: |
          pip-audit -r requirements.txt


  # ==================================================
  # JOB 9 - BUILD DOCKER IMAGES
  #
  # IMPORTANT:
  # This job is protected by GitHub Environment.
  #
  # All CI jobs above must pass first.
  # Then GitHub waits for manual approval.
  # Only after approval does Docker build start.
  # ==================================================

  build:
    name: Build Docker Images

    needs:
      - syntax
      - lint
      - unused-code
      - type-check
      - test
      - security
      - secrets
      - dependency-scan

    # ================================================
    # MANUAL APPROVAL
    # ================================================

    environment:
      name: docker-build-approval

    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      # -----------------------------------------------
      # Build frontend
      # -----------------------------------------------

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }} \
            ./frontend


      # -----------------------------------------------
      # Build backend
      # -----------------------------------------------

      - name: Build backend image
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }} \
            ./backend


      # -----------------------------------------------
      # Save frontend image
      # -----------------------------------------------

      - name: Save frontend image
        run: |
          docker save \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }} \
            -o frontend.tar


      # -----------------------------------------------
      # Save backend image
      # -----------------------------------------------

      - name: Save backend image
        run: |
          docker save \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }} \
            -o backend.tar


      # -----------------------------------------------
      # Upload frontend image
      # -----------------------------------------------

      - name: Upload frontend image
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend.tar


      # -----------------------------------------------
      # Upload backend image
      # -----------------------------------------------

      - name: Upload backend image
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend.tar


  
  # ==================================================
  # JOB 11 - SBOM
  # ==================================================

  sbom:
    name: Generate SBOM

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Download frontend image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image

      - name: Download backend image
        uses: actions/download-artifact@v4
        with:
          name: backend-image

      - name: Load images
        run: |
          docker load -i frontend.tar
          docker load -i backend.tar


      # -----------------------------------------------
      # Install Syft
      # -----------------------------------------------

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin


      # -----------------------------------------------
      # Frontend SBOM
      # -----------------------------------------------

      - name: Generate frontend SBOM
        run: |
          syft \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }} \
            -o cyclonedx-json=frontend-sbom.json


      # -----------------------------------------------
      # Backend SBOM
      # -----------------------------------------------

      - name: Generate backend SBOM
        run: |
          syft \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }} \
            -o cyclonedx-json=backend-sbom.json


      # -----------------------------------------------
      # Upload SBOMs
      # -----------------------------------------------

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            frontend-sbom.json
            backend-sbom.json


  # ==================================================
  # JOB 12 - PUSH TO ECR
  # ==================================================

  push-ecr:
    name: Push Images to Amazon ECR

    needs:
      - container-security
      - sbom

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      # -----------------------------------------------
      # Download images
      # -----------------------------------------------

      - name: Download frontend image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image

      - name: Download backend image
        uses: actions/download-artifact@v4
        with:
          name: backend-image


      # -----------------------------------------------
      # Load images
      # -----------------------------------------------

      - name: Load images
        run: |
          docker load -i frontend.tar
          docker load -i backend.tar


      # -----------------------------------------------
      # AWS OIDC
      # -----------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # -----------------------------------------------
      # ECR login
      # -----------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # -----------------------------------------------
      # Push frontend
      # -----------------------------------------------

      - name: Push frontend image
        run: |
          docker push \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}


      # -----------------------------------------------
      # Push backend
      # -----------------------------------------------

      - name: Push backend image
        run: |
          docker push \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}


      # -----------------------------------------------
      # Deployment metadata
      # -----------------------------------------------

      - name: Save deployment metadata
        run: |
          cat > deployment.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "repository": "${{ github.repository }}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}",
            "frontend_image": "${{ env.ECR_REGISTRY }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}",
            "backend_image": "${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}"
          }
          EOF


      - name: Upload deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: deployment-metadata
          path: deployment.json


  # ==================================================
  # JOB 13 - DEPLOY TO EC2
  # ==================================================

  deploy:
    name: Deploy to EC2 using SSM

    needs: push-ecr

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # -----------------------------------------------
      # Get current deployment version
      # -----------------------------------------------

      - name: Get current deployment version
        id: current
        shell: bash
        run: |

          set -e

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Get current deployment version" \
            --parameters 'commands=[
              "cd /home/ssm-user/github-cicd-demo || exit 1",
              "if [ -f .current_version ]; then cat .current_version; else echo none; fi"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Version check command: $COMMAND_ID"

          sleep 3

          CURRENT_VERSION=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text | tr -d '\r\n')

          if [ -z "$CURRENT_VERSION" ]; then
            CURRENT_VERSION="none"
          fi

          echo "CURRENT_VERSION=$CURRENT_VERSION"

          echo "CURRENT_VERSION=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"


      # -----------------------------------------------
      # Deploy using SSM
      # -----------------------------------------------

      - name: Deploy using SSM
        id: deploy
        shell: bash
        run: |

          cat > ssm-commands.json <<EOF
          {
            "commands": [
              "set -e",
              "echo '========================================'",
              "echo 'Starting deployment...'",
              "echo '========================================'",
              "cd /home/ssm-user/github-cicd-demo",
              "export IMAGE_TAG='${{ github.sha }}'",
              "export AWS_REGION='${{ env.AWS_REGION }}'",
              "export ECR_REGISTRY='${{ env.ECR_REGISTRY }}'",
              "echo 'IMAGE_TAG='$IMAGE_TAG",
              "echo 'Current version before deployment:'",
              "if [ -f .current_version ]; then cat .current_version; else echo none; fi",
              "echo 'Saving current version for rollback...'",
              "if [ -f .current_version ]; then cp .current_version .previous_version; else echo none > .previous_version; fi",
              "echo 'Previous version:'",
              "cat .previous_version",
              "echo 'Logging into ECR...'",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "echo 'Pulling new images...'",
              "docker compose pull",
              "echo 'Starting new containers...'",
              "docker compose up -d",
              "echo 'Waiting for containers...'",
              "sleep 10",
              "echo 'Container status:'",
              "docker compose ps",
              "echo 'Saving current version...'",
              "echo $IMAGE_TAG > .current_version",
              "echo 'Current version:'",
              "cat .current_version",
              "echo 'Deployment completed successfully.'"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy GitHub commit ${{ github.sha }}" \
            --parameters file://ssm-commands.json \
            --query "Command.CommandId" \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID"

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_OUTPUT"


      # -----------------------------------------------
      # Wait for deployment
      # -----------------------------------------------

      - name: Wait for deployment and capture result
        shell: bash
        run: |

          COMMAND_ID="${{ steps.deploy.outputs.COMMAND_ID }}"

          echo "Waiting for SSM deployment command..."
          echo "COMMAND_ID=$COMMAND_ID"

          set +e

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

          WAIT_STATUS=$?

          echo ""
          echo "========================================"
          echo "SSM DEPLOYMENT RESULT"
          echo "========================================"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          echo "========================================"

          if [ "$WAIT_STATUS" -ne 0 ]; then
            echo "Deployment failed."
            exit "$WAIT_STATUS"
          fi

          echo "Deployment succeeded."


  # ==================================================
  # JOB 14 - HEALTH VERIFICATION
  # ==================================================

  verify:
    name: Verify Deployment

    needs: deploy

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Verify containers and backend API
        id: verify
        shell: bash
        run: |

          cat > verify.json <<'EOF'
          {
            "commands": [
              "set -e",
              "cd /home/ssm-user/github-cicd-demo",
              "echo '========================================'",
              "echo 'CONTAINER STATUS'",
              "echo '========================================'",
              "docker compose ps",
              "echo '========================================'",
              "echo 'BACKEND HEALTH CHECK'",
              "echo '========================================'",
              "echo '========================================'",
              "echo 'HEALTH VERIFICATION COMPLETED'",
              "echo '========================================'"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Verify deployment ${{ github.sha }}" \
            --parameters file://verify.json \
            --query "Command.CommandId" \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID"

          sleep 3

          echo "Waiting for health verification..."

          set +e

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

          WAIT_STATUS=$?

          echo ""
          echo "========================================"
          echo "HEALTH VERIFICATION RESULT"
          echo "========================================"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          echo "========================================"

          if [ "$WAIT_STATUS" -ne 0 ]; then
            echo "Health verification failed."
            exit "$WAIT_STATUS"
          fi

          echo "Health verification succeeded."


  # ==================================================
  # JOB 15 - ROLLBACK
  # ==================================================

  rollback:
    name: Rollback Deployment

    needs:
      - deploy
      - verify

    if: failure()

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Rollback using SSM
        id: rollback
        shell: bash
        run: |

          cat > rollback.json <<EOF
          {
            "commands": [
              "set -e",
              "echo '========================================'",
              "echo 'STARTING ROLLBACK'",
              "echo '========================================'",
              "cd /home/ssm-user/github-cicd-demo",
              "if [ ! -f .previous_version ]; then echo 'No previous version found'; exit 1; fi",
              "export IMAGE_TAG=$(cat .previous_version)",
              "export AWS_REGION='${{ env.AWS_REGION }}'",
              "export ECR_REGISTRY='${{ env.ECR_REGISTRY }}'",
              "echo 'Rolling back to:'",
              "echo $IMAGE_TAG",
              "echo 'Logging into ECR...'",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "echo 'Pulling previous images...'",
              "docker compose pull",
              "echo 'Starting previous containers...'",
              "docker compose up -d",
              "sleep 10",
              "echo 'Container status after rollback:'",
              "docker compose ps",
              "echo $IMAGE_TAG > .current_version",
              "echo 'Current version after rollback:'",
              "cat .current_version",
              "echo 'Rollback completed successfully.'"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Rollback deployment ${{ github.sha }}" \
            --parameters file://rollback.json \
            --query "Command.CommandId" \
            --output text)

          echo "Rollback command: $COMMAND_ID"

          echo "ROLLBACK_COMMAND_ID=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          sleep 3

          echo "Waiting for rollback..."

          set +e

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

          WAIT_STATUS=$?

          echo ""
          echo "========================================"
          echo "ROLLBACK RESULT"
          echo "========================================"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          echo "========================================"

          if [ "$WAIT_STATUS" -ne 0 ]; then
            echo "Rollback failed."
            exit "$WAIT_STATUS"
          fi

          echo "Rollback succeeded."

